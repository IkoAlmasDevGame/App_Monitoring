<!DOCTYPE html>
<html lang="id">

   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Sistem Monitoring Maulid Premium</title>

      <!-- Fonts: Poppins & Amiri -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      <link rel="stylesheet" href="style.css">
      <link rel="shortcut icon" href="icons/sim_maulid.png" type="image/png">
      <link rel="manifest" href="manifest.json">
      <meta name="description" content="Sistem Informasi Management Monitoring Maulid untuk membantu mengelola, memantau, dan mendokumentasikan kegiatan Maulid secara mudah, terstruktur, dan efisien.">
      <meta name="keywords" content="monitoring maulid, sistem informasi maulid, manajemen maulid, management monitoring maulid, aplikasi monitoring maulid, aplikasi maulid, sistem management maulid, kegiatan maulid, informasi maulid, monitoring kegiatan maulid, pengelolaan maulid, aplikasi kegiatan keagamaan">
      <meta name="google-site-verification" content="D35ZrJpma3CFQJ9sDbp0-yGsKu_yOt4uQmW8f-AiAYk" />

      <link
         href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap"
         rel="stylesheet">

      <!-- Tailwind CSS -->
      <script src="https://cdn.tailwindcss.com"></script>
      <script>
         tailwind.config = {
            theme: {
               extend: {
                  colors: {
                     brand: {
                        green: '#059669', // Emerald 600
                        greenDark: '#047857',
                        greenLight: '#34d399',
                        gold: '#D97706', // Amber 600
                        goldLight: '#F59E0B',
                        bg: '#f8fafc' // Slate 50
                     }
                  },
                  fontFamily: {
                     sans: ['Poppins', 'sans-serif'],
                     arabic: ['Amiri', 'serif'],
                  },
                  boxShadow: {
                     'premium': '0 10px 40px -10px rgba(5, 150, 105, 0.15)',
                     'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                  }
               }
            }
         }
      </script>

      <!-- Chart.js & Lucide Icons -->
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <script src="https://unpkg.com/lucide@latest"></script>

      <style>
         body {
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
         }

         .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
         }

         .btn-depth {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
         }

         .btn-depth:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -6px rgba(5, 150, 105, 0.4);
         }

         .btn-depth:active {
            transform: translateY(1px);
            box-shadow: none;
         }

         ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
         }

         ::-webkit-scrollbar-track {
            background: transparent;
         }

         ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
         }

         ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
         }

         @keyframes fadeIn {
            from {
               opacity: 0;
               transform: translateY(5px);
            }

            to {
               opacity: 1;
               transform: translateY(0);
            }
         }

         .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
         }

         @keyframes slideInRight {
            from {
               transform: translateX(100%);
               opacity: 0;
            }

            to {
               transform: translateX(0);
               opacity: 1;
            }
         }

         .toast-enter {
            animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
         }

         .hidden-app {
            display: none !important;
         }

         .input-premium {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
         }

         .input-premium:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
            outline: none;
         }

         .kanban-col {
            min-height: 250px;
         }

         #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
         }

         #sidebarOverlay {
            transition: opacity 0.3s ease;
         }
      </style>
   </head>

   <body class="font-sans antialiased text-slate-800 selection:bg-brand-green selection:text-white">

      <div id="installBanner" class="install-banner" style="display: none;">
         <p>Install Maulid Monitoring for a better experience!</p>
         <button id="installBtn">Install Now</button>
         <button id="dismissBtn" onclick="this.parentNode.style.display='none'">Maybe Later</button>
      </div>

      <!-- LOADER & TOAST -->
      <div id="globalLoader"
         class="fixed inset-0 z-[99] flex flex-col items-center justify-center bg-brand-bg/90 backdrop-blur-sm hidden-app">
         <div class="relative w-16 h-16">
            <div class="absolute inset-0 border-4 border-brand-green/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-brand-green rounded-full border-t-transparent animate-spin">
            </div><i data-lucide="moon" class="absolute inset-0 m-auto text-brand-gold h-6 w-6"></i>
         </div>
         <p class="mt-4 text-sm font-medium animate-pulse text-brand-green" id="loaderText">Memproses Data...</p>
      </div>
      <div id="toastContainer"
         class="fixed top-4 right-4 z-[90] flex flex-col gap-2 pointer-events-none w-72 max-w-[90vw]"></div>

      <!-- LOGIN -->
      <div id="view-login"
         class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-brand-bg to-emerald-50/50 p-4">
         <div class="absolute -top-32 -left-32 w-96 h-96 bg-brand-green/10 rounded-full blur-3xl"></div>
         <div
            class="w-full max-w-sm md:max-w-md mx-auto glass rounded-3xl shadow-premium p-6 md:p-8 relative z-10 border border-white/80 animate-fade-in">
            <div class="text-center mb-8">
               <div
                  class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-green/10 text-brand-green mb-4 transform rotate-3">
                  <img src="icons/sim_maulid.png" alt="">
               </div>
               <h1 class="font-arabic text-3xl font-bold text-brand-green">SIM Maulid</h1>
               <p class="text-slate-500 font-medium text-xs md:text-sm mt-1 uppercase tracking-widest">Sistem Monitoring
                  Panitia</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
               <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1 ml-1">ALAMAT EMAIL</label>
                  <div class="relative">
                     <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
                     <input type="text" id="loginUsername" required
                        class="block w-full pl-11 pr-4 py-3 rounded-xl input-premium text-sm"
                        placeholder="masukkan username panitia">
                  </div>
               </div>
               <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1 ml-1">KATA SANDI</label>
                  <div class="relative">
                     <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
                     <input type="password" id="loginPassword" required
                        class="block w-full pl-11 pr-4 py-3 rounded-xl input-premium text-sm" placeholder="••••••••">
                  </div>
               </div>
               <button type="submit" id="btnLogin"
                  class="w-full bg-brand-green text-white font-semibold py-3.5 rounded-xl btn-depth flex justify-center items-center gap-2 mt-6 shadow-lg shadow-brand-green/20">
                  Masuk <i data-lucide="arrow-right" class="w-4 h-4"></i>
               </button>
            </form>
         </div>
      </div>

      <!-- APP STRUCTURE -->
      <div id="view-app" class="hidden-app min-h-screen flex bg-brand-bg relative">
         <div id="sidebarOverlay" onclick="toggleSidebar()"
            class="fixed inset-0 bg-slate-900/50 z-30 hidden md:hidden opacity-0"></div>

         <aside id="sidebar"
            class="w-64 glass border-r border-slate-200 flex flex-col fixed inset-y-0 left-0 z-40 transform -translate-x-full md:translate-x-0 md:relative transition-transform duration-300">
            <div class="p-6 flex items-center justify-between md:justify-start gap-3">
               <div class="flex items-center gap-3">
                  <div class="bg-brand-green text-white p-2 rounded-xl shadow-md"><i data-lucide="crescent"
                        class="w-5 h-5"></i></div>
                  <div>
                     <h2 class="font-bold text-lg leading-tight text-slate-800">Panitia<br><span
                           class="text-brand-green">Maulid</span></h2>
                  </div>
               </div>
               <button onclick="toggleSidebar()" class="md:hidden text-slate-400 p-1"><i data-lucide="x"
                     class="w-6 h-6"></i></button>
            </div>
            <div class="px-5 pb-6 border-b border-slate-100/50">
               <div class="bg-white p-3 rounded-2xl border border-slate-100 flex items-center gap-3">
                  <div
                     class="w-10 h-10 rounded-full bg-brand-gold/10 flex items-center justify-center text-brand-gold font-bold"
                     id="userInitial">S</div>
                  <div class="overflow-hidden flex-1">
                     <p class="text-sm font-bold text-slate-800 truncate" id="userNameDisplay">Nama User</p>
                     <p class="text-[11px] font-semibold text-brand-green uppercase tracking-wide truncate mt-0.5"
                        id="userRoleDisplay">Role</p>
                  </div>
               </div>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto" id="mainNav"></nav>
            <div class="p-4 border-t border-slate-200/60">
               <button onclick="logout()"
                  class="w-full flex items-center justify-center gap-2 px-4 py-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-xl text-sm font-semibold transition-colors">
                  <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
               </button>
            </div>
         </aside>

         <main class="flex-1 min-w-0 flex flex-col min-h-screen">
            <header
               class="glass sticky top-0 z-20 border-b border-slate-200 px-4 md:px-8 py-4 flex justify-between items-center">
               <div class="flex items-center gap-3 md:hidden">
                  <button onclick="toggleSidebar()"
                     class="text-slate-600 bg-white p-1.5 rounded-lg border border-slate-100"><i data-lucide="menu"
                        class="w-5 h-5"></i></button>
                  <h2 class="font-bold text-slate-800 truncate" id="mobileHeaderTitle">Dashboard</h2>
               </div>
               <div class="hidden md:block">
                  <h1 class="text-xl font-bold text-slate-800" id="headerTitle">Dashboard Utama</h1>
                  <p class="text-xs font-medium text-slate-500 mt-0.5" id="headerSubtitle">Pantau progress persiapan
                     acara</p>
               </div>
               <div class="bg-brand-gold/10 px-3 md:px-4 py-1.5 rounded-full flex items-center gap-1.5">
                  <i data-lucide="timer" class="w-3.5 h-3.5 text-brand-gold"></i>
                  <span class="text-xs md:text-sm font-bold text-brand-gold" id="countdownTimer">Hitung Mundur...</span>
               </div>
            </header>
            <div class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-6 overflow-x-hidden" id="pageContent">
               <!-- Dinamis -->
            </div>
         </main>
      </div>

      <!-- MODAL GENERIK -->
      <div id="genericModal"
         class="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm hidden-app p-4">
         <div
            class="bg-white rounded-3xl w-full max-w-lg flex flex-col max-h-[90vh] overflow-hidden border border-slate-100 shadow-2xl animate-fade-in">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
               <h3 class="font-bold text-lg text-slate-800" id="modalTitle">Judul</h3>
               <button onclick="closeModal()"
                  class="text-slate-400 hover:text-red-500 p-1 rounded-full hover:bg-slate-200 transition-colors"><i
                     data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 custom-scrollbar" id="modalBody"></div>
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3" id="modalFooter">
               <button onclick="closeModal()"
                  class="px-5 py-2 rounded-xl text-slate-600 font-semibold text-sm hover:bg-slate-200">Batal</button>
               <button id="modalSubmitBtn"
                  class="px-6 py-2 bg-brand-green text-white font-semibold text-sm rounded-xl btn-depth">Simpan</button>
            </div>
         </div>
      </div>

      <script src="scripts.js"></script>
      <script type="text/javascript">
         // PWA Installation handling
         let deferredPrompt;
         window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBanner = document.getElementById('installBanner');
            if (installBanner) installBanner.style.display = 'flex';
         });

         document.getElementById('installBtn').addEventListener('click', async () => {
            document.getElementById('installBanner').style.display = 'none';
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response: ${outcome}`);
            deferredPrompt = null;
         });

         window.addEventListener('appinstalled', (event) => {
            console.log('App was installed to home screen');
         });
      </script>
   </body>

</html>
